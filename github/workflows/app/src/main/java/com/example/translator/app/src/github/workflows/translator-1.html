<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#33207f;--bg2:#0a0a1f;--tx:#fff;--card:#ffffff14;--bd:#ffffff26;--fld:#00000045;--chip:#ffffff1c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#ddd6ff;--bg2:#f4f2ff;--tx:#161238;--card:#ffffffb0;--bd:#7c5cff33;--fld:#ffffffd0;--chip:#7c5cff1f}}
:root[data-theme="light"]{--bg1:#ddd6ff;--bg2:#f4f2ff;--tx:#161238;--card:#ffffffb0;--bd:#7c5cff33;--fld:#ffffffd0;--chip:#7c5cff1f}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:var(--tx);background:radial-gradient(circle at 15% 0,var(--bg1),var(--bg2) 65%) var(--bg2);padding:18px 14px 28px;display:flex;flex-direction:column;align-items:center;gap:12px}
@keyframes f{50%{transform:translateY(-9px)}}
.bot{width:210px;filter:drop-shadow(0 0 26px #00d4ff66)}
.fl{animation:f 3.4s ease-in-out infinite}
.sh{transform-box:fill-box;transform-origin:center;animation:s 3.4s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:b 4.2s infinite}
.pu{transition:transform .12s}
.brow{transform-box:fill-box;transform-origin:center;transition:transform .25s}
.think .brow{transform:translateY(-5px) rotate(-6deg)}
.mouth{opacity:0;transform-box:fill-box;transform-origin:center}
.talk .smile{opacity:0}
.talk .mouth{opacity:1;animation:m .2s infinite alternate}
.ant{animation:g 1.4s infinite alternate}
.ring{transform-box:fill-box;transform-origin:center;animation:r 2s infinite}
.think .ring{animation-duration:.6s}
.core{transform-box:fill-box;transform-origin:center;animation:g 2.2s infinite alternate}
.talk .core{animation:c .35s infinite alternate}
.armL{transform-box:fill-box;transform-origin:50% 8%}
.talk .armL{animation:wv .45s infinite alternate}
@keyframes s{50%{transform:scale(.82);opacity:.15}}
@keyframes b{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes m{to{transform:scaleY(1.7)}}
@keyframes g{from{opacity:.4}to{opacity:1}}
@keyframes r{from{transform:scale(.7);opacity:.9}to{transform:scale(1.5);opacity:0}}
@keyframes c{to{transform:scale(1.35)}}
@keyframes wv{to{transform:rotate(-28deg)}}
.wave{display:flex;gap:5px;height:26px;align-items:center;opacity:0;transition:.3s}
.talk~.wave{opacity:1}
.wave i{width:5px;height:8px;border-radius:3px;background:#00d4ff;animation:w .5s infinite alternate}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.15s}
@keyframes w{to{height:24px}}
.bubble{max-width:430px;width:100%;min-height:62px;padding:15px 18px;border-radius:22px;background:linear-gradient(135deg,#7c5cff,#00b8ff);color:#fff;font-size:19px;line-height:1.7;text-align:center;box-shadow:0 10px 30px #7c5cff55;white-space:pre-wrap}
.hint{font-size:13px;color:#d9a300;min-height:16px;text-align:center;max-width:430px}
.card{max-width:430px;width:100%;padding:16px;border-radius:26px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--bd);display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
select,textarea{flex:1;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--fld);color:var(--tx);font-size:16px;font-family:inherit}
textarea{width:100%;min-height:96px;resize:none}
button{border:0;border-radius:14px;padding:13px;font-size:17px;color:var(--tx);cursor:pointer;transition:.15s;font-family:inherit}
button:active{transform:scale(.95)}
.swap{background:var(--chip);width:48px;font-size:20px}
.go{background:linear-gradient(135deg,#7c5cff,#00b8ff);color:#fff;font-weight:700;box-shadow:0 8px 22px #00b8ff55}
.say{background:var(--chip)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{padding:7px 12px;font-size:14px;border-radius:20px;background:var(--chip)}
.note{font-size:12px;opacity:.7;text-align:center;max-width:430px}
.menu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:5;width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--bd);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0}
.menu i{display:block;width:22px;height:2.5px;border-radius:2px;background:var(--tx)}
.ov{position:fixed;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.25s;z-index:6}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:7;transform:translateX(-105%);transition:transform .3s;background:var(--bg2);border-right:1px solid var(--bd);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.open .dr{transform:none}.open .ov{opacity:1;pointer-events:auto}
.dr h3{font-size:18px}.dr label{display:flex;flex-direction:column;gap:6px;font-size:14px}
.dr .sw{flex-direction:row;justify-content:space-between;align-items:center}
.hist{display:flex;flex-direction:column;gap:6px}
.hist button{text-align:start;padding:9px 11px;font-size:14px;background:var(--chip);border-radius:12px}
.ft{margin-top:auto;padding-top:18px;text-align:center;font-size:13px;line-height:1.9;opacity:.75}
.chin{opacity:0;transition:opacity .3s}
.think .chin{opacity:1}
.armR{transform-box:fill-box;transform-origin:50% 8%;transition:opacity .3s}
.think .armR{opacity:0}
.tear{opacity:0}
.sad .tear{opacity:1;animation:tear 1.6s infinite}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(26px);opacity:0}}
.sad .smile{transform-box:fill-box;transform-origin:center;transform:scaleY(-1)}
.sad .brow{transform:translateY(4px)}
.sad .fl{animation:sadf 3s ease-in-out infinite}
@keyframes sadf{50%{transform:translateY(8px) rotate(3deg)}}
.happy .fl{animation:hop .5s ease-in-out 4}
@keyframes hop{50%{transform:translateY(-22px) scale(1.05)}}
.happy .smile{opacity:0}
.happy .mouth{opacity:1;animation:laugh .3s 6 alternate}
@keyframes laugh{to{transform:scaleY(1.9)}}
.happy .eye{animation:none;transform:scaleY(.55)}
.dance .fl{animation:dance 1s ease-in-out infinite}
@keyframes dance{25%{transform:translateY(-12px) rotate(-7deg)}75%{transform:translateY(-12px) rotate(7deg)}}
.dance .armL{animation:wv .5s infinite alternate}
.dance .armR{animation:wv2 .5s infinite alternate}
@keyframes wv2{to{transform:rotate(28deg)}}
@media (prefers-reduced-motion:reduce){.fl,.sh,.eye,.ant,.ring,.core,.armL{animation:none!important}}
</style></head><body>
<button class="menu" onclick="tg()" aria-label="القائمة"><i></i><i></i><i></i><i></i></button><div class="ov" onclick="tg()"></div>
<aside class="dr"><h3>⚙️ الإعدادات</h3>
<label class="sw">النطق التلقائي<input type="checkbox" id="auto" checked></label>
<label>سرعة الصوت<input type="range" id="rate" min=".6" max="1.4" step=".1" value="1"></label>
<label>نبرة الصوت<input type="range" id="pitch" min=".5" max="1.6" step=".1" value="1"></label>
<label>حجم الخط<input type="range" id="fs" min="16" max="26" step="1" value="19" oninput="sv()"></label>
<label>المظهر<select id="th" onchange="sv()"><option value="auto">حسب الجهاز</option><option value="dark">داكن</option><option value="light">فاتح</option></select></label>
<button class="say" onclick="cp()">📋 نسخ الترجمة</button>
<h3>🕘 السجل</h3><div class="hist" id="hist"></div>
<button class="say" onclick="hs=[];rh()">🗑️ مسح السجل</button></aside>
<div id="bot"><svg class="bot" viewBox="0 0 240 270" aria-hidden="true"><defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bfb3ff"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b6cff"/><stop offset="1" stop-color="#00d4ff"/></linearGradient>
<radialGradient id="vs" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#1b1f5e"/><stop offset="1" stop-color="#070820"/></radialGradient>
<filter id="gl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<ellipse class="sh" cx="120" cy="262" rx="52" ry="7" fill="#000" opacity=".28"/>
<g class="fl">
<line x1="120" y1="30" x2="120" y2="56" stroke="#b9b0ff" stroke-width="5" stroke-linecap="round"/>
<circle cx="120" cy="24" r="14" fill="#ffd24a" opacity=".5" filter="url(#gl)"/><circle class="ring" cx="120" cy="24" r="12" fill="none" stroke="#ffd24a" stroke-width="2"/><circle class="ant" cx="120" cy="24" r="8" fill="#ffd24a"/>
<g class="armL"><rect x="28" y="190" width="20" height="50" rx="10" fill="url(#ac)"/><circle cx="38" cy="244" r="9" fill="url(#bd)"/></g>
<g class="armR"><rect x="192" y="190" width="20" height="50" rx="10" fill="url(#ac)"/><circle cx="202" cy="244" r="9" fill="url(#bd)"/></g>
<rect x="104" y="168" width="32" height="16" rx="6" fill="#8e82e6"/>
<rect x="66" y="178" width="108" height="76" rx="32" fill="url(#bd)"/>
<rect x="86" y="196" width="68" height="38" rx="19" fill="url(#vs)"/>
<circle cx="120" cy="215" r="14" fill="#00f0ff" opacity=".55" filter="url(#gl)"/><circle class="core" cx="120" cy="215" r="9" fill="#00f0ff"/>
<circle cx="98" cy="215" r="3" fill="#ff6ad5"/><circle cx="142" cy="215" r="3" fill="#ffd24a"/>
<rect x="20" y="92" width="26" height="52" rx="13" fill="url(#ac)"/><rect x="194" y="92" width="26" height="52" rx="13" fill="url(#ac)"/>
<circle cx="33" cy="118" r="5" fill="#fff" opacity=".85"/><circle cx="207" cy="118" r="5" fill="#fff" opacity=".85"/>
<rect x="38" y="52" width="164" height="128" rx="58" fill="url(#bd)"/>
<ellipse cx="86" cy="66" rx="30" ry="8" fill="#fff" opacity=".7" transform="rotate(-18 86 66)"/>
<rect x="56" y="74" width="128" height="86" rx="38" fill="url(#vs)" stroke="#00d4ff" stroke-opacity=".5" stroke-width="2"/>
<path class="brow" d="M78 91 Q92 84 106 91" fill="none" stroke="#7fe8ff" stroke-width="4" stroke-linecap="round"/><path class="brow" d="M134 91 Q148 84 162 91" fill="none" stroke="#7fe8ff" stroke-width="4" stroke-linecap="round"/>
<g class="eye"><ellipse cx="92" cy="113" rx="16" ry="19" fill="#00f0ff"/><circle class="pu" cx="92" cy="113" r="8" fill="#06123a"/><circle cx="86" cy="106" r="4" fill="#fff"/></g>
<g class="eye"><ellipse cx="148" cy="113" rx="16" ry="19" fill="#00f0ff"/><circle class="pu" cx="148" cy="113" r="8" fill="#06123a"/><circle cx="142" cy="106" r="4" fill="#fff"/></g>
<ellipse cx="72" cy="141" rx="9" ry="5" fill="#ff6ad5" opacity=".45"/><ellipse cx="168" cy="141" rx="9" ry="5" fill="#ff6ad5" opacity=".45"/>
<path class="smile" d="M104 142 Q120 156 136 142" fill="none" stroke="#ff6ad5" stroke-width="5" stroke-linecap="round"/>
<rect class="mouth" x="104" y="139" width="32" height="12" rx="6" fill="#ff6ad5"/>
</g><g class="chin"><line x1="193" y1="205" x2="152" y2="172" stroke="url(#ac)" stroke-width="16" stroke-linecap="round"/><circle cx="146" cy="170" r="10" fill="url(#bd)"/></g><ellipse class="tear" cx="84" cy="136" rx="3.5" ry="6" fill="#7fe8ff"/></svg></div>
<div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
<div class="bubble" id="out">أهلاً! اكتب شي وأنا أترجمه وأقوله لك 🎙️</div>
<div class="hint" id="hint"></div>
<div class="card">
<div class="row"><select id="from" aria-label="من"></select><button class="swap" onclick="sw()" aria-label="تبديل">⇄</button><select id="to" aria-label="إلى"></select></div>
<textarea id="inp" placeholder="اكتب النص هنا..."></textarea>
<button class="go" onclick="tr()">ترجم ✨</button>
<button class="say" onclick="speak(last)">🔊 أعد النطق</button>
</div>
<footer class="ft"><div>تم الإنشاء من قبل علي ناجح الخفاجي</div><div>جميع الحقوق محفوظة ©</div></footer>
<script>
const SERVER="http://127.0.0.1:8080";
let L={};
let last="",tm;const $=i=>document.getElementById(i),bot=$("bot"),out=$("out");
const pend={};let rid=0;
window.onResult=(id,d)=>{pend[id](d);delete pend[id]};
const ask=(text,from,to)=>new Promise(res=>{const id=++rid;pend[id]=res;Android.translate(text,from,to,id)});
const d0=JSON.parse(Android.langs());
for(const k in d0)L[k]={n:d0[k].native,tts:d0[k].tts,rtl:d0[k].rtl};
for(const s of["from","to"])for(const k in L)$(s).add(new Option(L[k].n,k));
$("from").value=L.ar?"ar":Object.keys(L)[0];
$("to").value=L.en?"en":Object.keys(L)[1]||Object.keys(L)[0];
const norm=t=>t.toLowerCase().replace(/[\s.,!?؟،¿¡？！。，]+/g," ").trim();

let hs=[];addEventListener('pointermove',e=>{const r=bot.getBoundingClientRect(),x=Math.max(-5,Math.min(5,(e.clientX-r.left-r.width/2)/25)),y=Math.max(-6,Math.min(6,(e.clientY-r.top-r.height/2)/25));document.querySelectorAll('.pu').forEach(p=>p.style.transform='translate('+x+'px,'+y+'px)')});
function tg(){document.body.classList.toggle("open")}
function sv(){document.documentElement.dataset.theme=$("th").value=="auto"?"":$("th").value;out.style.fontSize=$("fs").value+"px"}
function cp(){if(last&&navigator.clipboard)navigator.clipboard.writeText(last);$("hint").textContent=last?"تم النسخ ✅":""}
function rh(){$("hist").replaceChildren(...hs.map(h=>{const b=document.createElement("button");b.textContent=h.a+"  ←  "+h.b;b.onclick=()=>{$("inp").value=h.a;tg()};return b}))}
function sw(){const a=$("from").value;$("from").value=$("to").value;$("to").value=a}
function type(t){out.dir=L[$("to").value].rtl?"rtl":"ltr";clearInterval(tm);let i=0;out.textContent="";tm=setInterval(()=>{out.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(tm)},22)}
function speak(t){if(!t||!window.speechSynthesis)return;speechSynthesis.cancel();const c=L[$("to").value].tts,m=new SpeechSynthesisUtterance(t);m.lang=c;m.rate=+$('rate').value;m.pitch=+$('pitch').value;
const v=speechSynthesis.getVoices().find(v=>v.lang.replace("_","-").toLowerCase().startsWith(c.slice(0,2)));if(v)m.voice=v;
$("hint").textContent=v?"":"ما لقيت صوتاً لهذي اللغة في جهازك. الروبوت يتحرك لكن النطق يحتاج صوتاً منصّباً.";
m.onstart=()=>bot.classList.add("talk");m.onend=m.onerror=()=>bot.classList.remove("talk");
bot.classList.add("talk");setTimeout(()=>{if(!speechSynthesis.speaking)bot.classList.remove("talk")},2500);speechSynthesis.speak(m)}
function mood(m){bot.classList.remove("think","happy","sad","dance");if(m)bot.classList.add(m)}
let mt;function flash(m,ms){mood(m);clearTimeout(mt);mt=setTimeout(()=>{if(!bot.classList.contains("think"))mood("")},ms)}
let lastAct=Date.now();function act(){lastAct=Date.now();if(bot.classList.contains("dance"))mood("")}
["pointerdown","pointermove","keydown","touchstart","input"].forEach(ev=>addEventListener(ev,act,{passive:true}));
setInterval(()=>{const b=bot.classList;if(Date.now()-lastAct>20000&&!b.contains("think")&&!b.contains("talk")&&!b.contains("happy")&&!b.contains("sad"))mood("dance")},1000);
async function tr(){const text=$("inp").value.trim();if(!text)return;act();out.dir="rtl";out.textContent="أفكر... 🤔";mood("think");
try{const d=await ask(text,$("from").value,$("to").value);
if(d.error||!d.text){out.textContent="⚠️ "+(d.error||"ما عطاني رد");flash("sad",3000);return}
last=d.text;hs.unshift({a:text,b:last});hs=hs.slice(0,8);rh();type(last);flash("happy",2500);if($("auto").checked)speak(last)}
catch(e){out.textContent="⚠️ تأكد أن السيرفر شغال";flash("sad",3000)}}
</script></body></html>
